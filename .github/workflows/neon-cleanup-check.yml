name: Check Neon cleanup
on:
  pull_request:
    paths:
      - .github/neon-cleanup/**
      - .github/workflows/neon-preview-cleanup.yml
      - .github/workflows/neon-cleanup-check.yml
  push:
    paths:
      - .github/neon-cleanup/**
      - .github/workflows/neon-preview-cleanup.yml
      - .github/workflows/neon-cleanup-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/neon-cleanup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun run lint
      - run: bun run prettier
      - run: bun test
      - run: bun run test:e2e
